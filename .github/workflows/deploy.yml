name: Deploy

on:
  # 主要觸發：merge 或直接 push 到 develop
  push:
    branches: [develop]
  # Contentful webhook 透過 GitHub dispatches API 觸發（event_type: contentful-publish）
  repository_dispatch:
    types: [contentful-publish]
  # 手動觸發，緊急重部署或驗證用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages Actions 官方建議：同一時間只允許一個 deploy，不取消進行中的 run 以避免狀態殘破
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          CTF_CDA_ACCESS_TOKEN: ${{ secrets.CTF_CDA_ACCESS_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
