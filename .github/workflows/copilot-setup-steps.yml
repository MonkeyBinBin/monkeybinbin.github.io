name: Copilot Setup Steps

# 此 workflow 為 GitHub Copilot cloud agent 專用的環境 bootstrap。
# 檔名與 job 名稱 copilot-setup-steps 必須完全對應，Copilot 會在啟動 agent
# 沙箱時自動執行以下步驟，讓 agent 接手時已有可用的 Node.js 與 node_modules。

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
