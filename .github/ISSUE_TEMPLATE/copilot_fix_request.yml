name: Copilot 自動修復請求
description: 提交一個適合 GitHub Copilot cloud agent 自動修復的低風險 issue
title: "[Copilot] "
labels: ["copilot-fix"]
body:
  - type: markdown
    attributes:
      value: |
        此模板用於提交**可直接 assign 給 Copilot cloud agent** 的任務。

        **任務範圍與風險判斷由 Copilot 依 `.github/copilot-instructions.md` 自行決定**，
        你只需要清楚描述需求即可。若 Copilot 判斷任務超出白名單（例如牽涉 build 腳本、
        dependency 升級、跨 5 個以上檔案的大規模重構），它會在 PR 描述中說明無法自動修復
        並保持 Draft 狀態等待人工決定。

  - type: input
    id: file
    attributes:
      label: 目標檔案
      description: 明確指出要修改的單一檔案路徑。
      placeholder: 例：pages/about/index.vue
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 要做什麼
      description: 一句話描述任務，越具體越好。
      placeholder: |
        例：pages/about/index.vue 第 42 行的 "abou" 改成 "about"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 額外 context（可選）
      description: 如有特殊需求、限制、相關 issue / PR 連結或參考資料可補充。
